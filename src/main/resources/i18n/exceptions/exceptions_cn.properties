# TaskParser
TODO_DESCRIPTION_MISSING=待办事项需要描述。示例：todo 借书
DEADLINE_BY_MARKER_MISSING=截止任务需要在 "/by" 后填写日期或时间。示例：deadline 提交报告 /by 星期五下午5点
DEADLINE_DESCRIPTION_MISSING=截止任务需要在 "/by" 前填写描述。示例：deadline 提交报告 /by 星期五下午5点
DEADLINE_BY_VALUE_MISSING=请在 "/by" 后填写日期或时间。示例：deadline 提交报告 /by 星期五下午5点
EVENT_FROM_MARKER_MISSING=活动需要在 "/from" 后填写开始时间。示例：event 会议 /from 下午2点 /to 下午4点
EVENT_TO_MARKER_MISSING=活动需要在 "/to" 后填写结束时间。示例：event 会议 /from 下午2点 /to 下午4点
EVENT_MARKERS_OUT_OF_ORDER=请把 "/from" 放在 "/to" 前。示例：event 会议 /from 下午2点 /to 下午4点
EVENT_DESCRIPTION_MISSING=活动需要在 "/from" 前填写描述。示例：event 会议 /from 下午2点 /to 下午4点
EVENT_FROM_VALUE_MISSING=请在 "/from" 后填写开始时间。示例：event 会议 /from 下午2点 /to 下午4点
EVENT_TO_VALUE_MISSING=请在 "/to" 后填写结束时间。示例：event 会议 /from 下午2点 /to 下午4点
DUPLICATE_MARKER="%s" 只能出现一次。请删除多余的标记后重试。
TASK_ID_MISSING=请输入要执行 %1$s 操作的任务编号。示例：%1$s 1
TASK_ID_NOT_INTEGER="%s" 不是有效的任务编号。请输入正整数。
TASK_ID_NOT_POSITIVE=任务编号从 1 开始。输入 "list" 查看可用的任务编号。
TASK_ID_TOO_LARGE=任务编号 "%s" 太大。输入 "list" 查看可用的任务编号。
TASK_LIST_EMPTY=目前没有任务可执行 %s 操作。请先添加任务，例如：todo 借书
TASK_NOT_FOUND=任务 %d 不存在。请选择 1 至 %d 之间的编号，或输入 "list" 查看任务。
UNKNOWN_COMMAND="%s" 不是可识别的指令。可用指令：todo、deadline、event、list、mark、unmark、bye。
