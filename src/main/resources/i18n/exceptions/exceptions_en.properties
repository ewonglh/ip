# TaskParser
TODO_DESCRIPTION_MISSING=A todo needs a description. Try: todo borrow a book
DEADLINE_BY_MARKER_MISSING=A deadline needs "/by" followed by its date or time. Try: deadline submit report /by Friday 5pm
DEADLINE_DESCRIPTION_MISSING=A deadline needs a description before "/by". Try: deadline submit report /by Friday 5pm
DEADLINE_BY_VALUE_MISSING=Enter a date or time after "/by". Try: deadline submit report /by Friday 5pm
EVENT_FROM_MARKER_MISSING=An event needs "/from" followed by its start time. Try: event meeting /from 2pm /to 4pm
EVENT_TO_MARKER_MISSING=An event needs "/to" followed by its end time. Try: event meeting /from 2pm /to 4pm
EVENT_MARKERS_OUT_OF_ORDER=Place "/from" before "/to". Try: event meeting /from 2pm /to 4pm
EVENT_DESCRIPTION_MISSING=An event needs a description before "/from". Try: event meeting /from 2pm /to 4pm
EVENT_FROM_VALUE_MISSING=Enter a start time after "/from". Try: event meeting /from 2pm /to 4pm
EVENT_TO_VALUE_MISSING=Enter an end time after "/to". Try: event meeting /from 2pm /to 4pm
DUPLICATE_MARKER="%s" can only appear once. Remove the extra marker and try again.
TASK_ID_MISSING=Enter the task number to %1$s. Try: %1$s 1
TASK_ID_NOT_INTEGER="%s" is not a valid task number. Enter a positive whole number.
TASK_ID_NOT_POSITIVE=Task numbers start from 1. Use "list" to see the available task numbers.
TASK_ID_TOO_LARGE=The task number "%s" is too large. Use "list" to see the available task numbers.
TASK_LIST_EMPTY=There are no tasks to %s. Add one first, for example: todo borrow a book
TASK_NOT_FOUND=Task %d does not exist. Choose a number from 1 to %d, or use "list" to view your tasks.
UNKNOWN_COMMAND="%s" is not a recognized command. Available commands: todo, deadline, event, list, mark, unmark, bye.
